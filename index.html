<style>
:root{color-scheme:dark;--bg:#0b1033;--bgimg:linear-gradient(120deg,#0b1033,#1b1260,#0e3a6e,#3a1457,#0b1033);--splash:radial-gradient(circle at 50% 40%,rgba(30,40,120,.75),rgba(8,10,40,.96));--card:rgba(255,255,255,.09);--line:rgba(255,255,255,.16);--tx:#fff;--mu:#b9c0ee;--bo:.5;--shadow:0 12px 30px rgba(0,0,0,.35);--blue:#5db4e8;--orange:#f98050;--amber:#ffa94d;--pink:#ff5fa2;--green:#2ee6a6}
:root[data-theme=light]{color-scheme:light;--bg:#f1f6ff;--bgimg:linear-gradient(120deg,#e3f2ff,#fff0e3,#f4e6ff,#e2fbf0,#e3f2ff);--splash:radial-gradient(circle at 50% 40%,rgba(255,255,255,.7),rgba(225,235,255,.93));--card:rgba(255,255,255,.75);--line:rgba(40,50,120,.15);--tx:#1b1f4b;--mu:#5a6094;--bo:.28;--shadow:0 10px 26px rgba(60,70,160,.25)}
[data-theme=light] .clock b{color:#e8590c}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:'Prompt','Sarabun',sans-serif;line-height:1.6;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
/* ===== พื้นหลังเคลื่อนไหว ===== */
#bg{position:fixed;inset:0;z-index:0;background:var(--bgimg);background-size:400% 400%;animation:flow 22s ease infinite}
@keyframes flow{50%{background-position:100% 50%}}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:var(--bo);z-index:0;animation:drift 18s ease-in-out infinite alternate}
.b1{width:46vmax;height:46vmax;background:#2f8fe0;top:-14vmax;left:-12vmax}
.b2{width:40vmax;height:40vmax;background:#ff6a3d;bottom:-14vmax;right:-10vmax;animation-duration:24s}
.b3{width:30vmax;height:30vmax;background:#b13cff;top:35%;left:45%;opacity:calc(var(--bo)*.7);animation-duration:30s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.2)}}
#fx{position:fixed;inset:0;z-index:1;pointer-events:none}
/* ===== หน้าโลโก้ (Splash / พักหน้าจอ) ===== */
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--splash);transition:opacity .7s,visibility .7s;cursor:pointer}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.ring{position:absolute;width:min(78vw,520px);aspect-ratio:1;border-radius:50%;border:2px solid transparent;background:conic-gradient(from 0deg,var(--blue),var(--pink),var(--orange),var(--amber),var(--green),var(--blue)) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 8s linear infinite;opacity:.7}
.ring.r2{width:min(60vw,400px);animation-direction:reverse;animation-duration:12s;opacity:.45}
@keyframes spin{to{transform:rotate(360deg)}}
.logobox{position:relative;background:#fff;border-radius:28px;padding:10px 18px;box-shadow:0 0 0 5px rgba(255,255,255,.12),0 20px 70px rgba(93,180,232,.55);animation:pop 1s cubic-bezier(.2,1.4,.4,1) both,float 4s ease-in-out 1s infinite;overflow:hidden}
.logobox img{display:block;width:min(44vw,210px);height:auto}
.logobox::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.9),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out 1s infinite}
@keyframes shine{60%,100%{left:140%}}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes float{50%{transform:translateY(-12px)}}
.sdate{margin-top:34px;font-size:clamp(15px,3.6vw,22px);color:var(--mu);letter-spacing:.5px;animation:up .8s .5s both}
.stime{font-size:clamp(46px,13vw,96px);font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--blue),var(--pink),var(--amber),var(--green),var(--blue));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:up .8s .7s both,hue 6s linear infinite;filter:drop-shadow(0 0 18px rgba(255,255,255,.25))}
@keyframes hue{to{background-position:300% 0}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sub{margin-top:8px;font-size:14px;color:var(--mu);animation:up .8s .9s both}
.prog{margin-top:20px;width:min(70vw,300px);height:6px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;animation:up .8s 1s both}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--pink),var(--amber));border-radius:9px}
.prog.run i{animation:fill var(--d,3s) linear forwards}
@keyframes fill{to{width:100%}}
.hint{margin-top:10px;font-size:12px;color:var(--mu);opacity:.8}
/* ===== แดชบอร์ด ===== */
#app{position:relative;z-index:5;max-width:1280px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between;padding:12px 16px;border-radius:22px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:12px}
.aic{width:68px;height:68px;flex:none;filter:drop-shadow(0 6px 14px rgba(93,180,232,.55))}
.hr{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lgp{background:#fff;border-radius:12px;padding:5px 10px;box-shadow:0 6px 22px rgba(93,180,232,.35);border:1px solid rgba(0,0,0,.06)}
.lgp img{height:24px;display:block}
.theme{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;line-height:1;transition:transform .3s}
.theme:hover{transform:rotate(25deg) scale(1.1)}
@media(max-width:560px){.hr{width:100%;justify-content:space-between}}
.badge{width:124px;height:124px;margin-bottom:6px;filter:drop-shadow(0 10px 30px rgba(93,180,232,.7));animation:pop 1s cubic-bezier(.2,1.4,.4,1) both,float 4s ease-in-out 1s infinite}
.badge svg{width:100%;height:100%}
.wm{font-weight:700;font-size:28px;letter-spacing:4px;margin-bottom:14px;background:linear-gradient(90deg,var(--blue),var(--pink),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent;animation:up .8s .3s both}
.brand h1{margin:0;font-size:clamp(20px,4vw,28px);font-weight:700;line-height:1.25}
.brand small{color:var(--mu);font-size:12px;display:block;font-weight:300}
.clock{text-align:right;font-variant-numeric:tabular-nums}
.clock b{display:block;font-size:22px;font-weight:600;color:var(--amber)}
.clock span{font-size:12px;color:var(--mu)}
.tools{margin:18px 0 10px;display:flex;flex-direction:column;gap:12px}
.search{display:flex;align-items:center;gap:10px;padding:0 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;padding:13px 0}
.search input::placeholder{color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;transition:.2s}
.chip.on{background:linear-gradient(90deg,var(--blue),var(--pink));border-color:transparent;font-weight:600;box-shadow:0 6px 20px rgba(255,95,162,.4)}
.sec{margin:28px 0 14px;display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600}
.cb{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;font-size:19px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.sec em{font-style:normal;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--card);color:var(--mu);font-weight:400;border:1px solid var(--line)}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}}
.card{position:relative;text-align:left;border:0;border-radius:24px;padding:16px;min-height:158px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;cursor:pointer;
 background:radial-gradient(circle at 100% 0,rgba(255,255,255,.28) 0 26%,transparent 27%),radial-gradient(circle at 0 100%,rgba(0,0,0,.2) 0 24%,transparent 25%),linear-gradient(145deg,var(--c1),var(--c2));
 box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.22);overflow:hidden;
 transform:perspective(700px) translateY(var(--ty,0)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--s,1));
 transition:transform .2s ease-out,box-shadow .3s;animation:in .6s backwards;animation-delay:calc(var(--i)*40ms)}
.card::before{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:left .8s;pointer-events:none}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(190px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.32),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover,.card:focus-visible{--ty:-6px;--s:1.03;outline:0;box-shadow:0 22px 46px var(--g),inset 0 0 0 1px rgba(255,255,255,.4)}
.card:hover::before{left:130%}.card:hover::after{opacity:1}
.card:active{--s:.97}
@keyframes in{from{opacity:0;transform:translateY(22px)}}
.ic{position:relative;z-index:1;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);box-shadow:0 6px 16px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.45);animation:bob 3.4s ease-in-out infinite;animation-delay:calc(var(--i)*-.35s)}
@keyframes bob{50%{transform:translateY(-4px) rotate(-5deg)}}
@keyframes wig{25%{transform:rotate(-14deg) scale(1.15)}60%{transform:rotate(12deg) scale(1.15)}}
.card:hover .ic{animation:wig .6s}
.tx{position:relative;z-index:1}
.nm{font-weight:600;font-size:15px;line-height:1.35;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.ds{font-size:11px;opacity:.9;font-weight:300}
.go{display:inline-block;margin-top:8px;font-size:11px;padding:2px 10px;border-radius:99px;background:rgba(255,255,255,.24);transition:.25s}
.card:hover .go{background:#fff;color:#222;transform:translateX(4px)}
.fav{position:absolute;right:10px;top:10px;z-index:3;border:0;background:rgba(0,0,0,.22);color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;line-height:1;transition:transform .2s}
.fav:hover{transform:scale(1.2) rotate(15deg)}
.fav.on{background:rgba(255,255,255,.95);color:#e8a000}
.empty{text-align:center;padding:50px 10px;color:var(--mu)}
footer{margin-top:36px;text-align:center;font-size:12px;color:var(--mu)}
/* ===== หน้าต่างเปิดแอป ===== */
#viewer{position:fixed;inset:0;z-index:30;display:flex;visibility:hidden;opacity:0;transform:translateY(18px) scale(.98);transition:opacity .25s,transform .25s,visibility .25s;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
#viewer.show{visibility:visible;opacity:1;transform:none}
.vbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(90deg,#1b1260,#0e3a6e)}
.vbar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.vbtn{border:0;border-radius:12px;padding:8px 14px;background:rgba(255,255,255,.16);font-size:14px;white-space:nowrap}
.vbtn.hl{background:linear-gradient(90deg,var(--orange),var(--pink))}
#frames{flex:1;position:relative;background:#fff;padding-bottom:env(safe-area-inset-bottom,0px)}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
#frames iframe.on{display:block}
#vspin{position:absolute;inset:0;z-index:2;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);color:var(--mu)}
#vspin.show{display:flex}
.sp{width:48px;height:48px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--pink);border-right-color:var(--blue);animation:spin .8s linear infinite}
button,.card{touch-action:manipulation}
html{scroll-behavior:smooth}
body.busy #bg,body.busy .blob,body.busy .ic,body.busy .ring{animation-play-state:paused}
.static .card{animation:none}
#admin{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;background:rgba(5,8,30,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);visibility:hidden;opacity:0;transition:opacity .25s,visibility .25s}
#admin.show{visibility:visible;opacity:1}
.apanel{width:100%;max-width:720px;height:100%;display:flex;flex-direction:column;background:var(--bg);border-inline:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);transform:translateY(20px);transition:transform .25s}
#admin.show .apanel{transform:none}
.ahead{display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(90deg,#1b1260,#0e3a6e);color:#fff}
.ahead b{flex:1;font-size:17px}
#admBody{flex:1;overflow-y:auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.tb{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ab{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-size:13px}
.abp{border:0;background:linear-gradient(90deg,var(--blue),var(--pink));color:#fff;font-weight:600;border-radius:12px;padding:10px 18px}
.abd{background:#ef4444;color:#fff;border:0;border-radius:12px;padding:10px 18px}
.note{font-size:12px;color:var(--mu);margin:0 0 12px}
.ag{margin-bottom:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.ah{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.ah b{font-size:14px}.ah em{font-style:normal;font-size:11px;color:var(--mu)}
.ah .cb{width:30px;height:30px;font-size:16px;border-radius:10px}
.sp1{flex:1}
.ar{display:flex;align-items:center;gap:6px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:14px}
.ar:last-child{border-bottom:0}.ar.mu{color:var(--mu);font-size:12px}
.ai{width:28px;text-align:center}.an{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px;line-height:1;padding:0}
.ib:hover{background:var(--line)}
.fl{display:block;margin:12px 0 4px;font-size:13px;color:var(--mu)}
.inp{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;outline:0}
.inp:focus{border-color:var(--blue)}
textarea.inp{min-height:220px;font-size:12px;font-family:monospace}
.sws{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.sw{width:38px;height:38px;border-radius:12px;border:3px solid transparent;padding:0}
.sw.on{border-color:var(--tx);transform:scale(1.12)}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
#vload{position:absolute;top:56px;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--pink),var(--amber));animation:fill 2.5s ease-out forwards}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:80;padding:12px 20px;border-radius:14px;background:#10b981;color:#fff;font-size:14px;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:#ef4444}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}

function defaultCfg(){const cats=[],apps=[];let k=0;DEF.forEach(c=>{cats.push({id:c.id,n:c.n,ic:CI[c.id],c:c.c});c.a.forEach(x=>apps.push({name:x[0],url:B+x[1],ic:x[2],ds:x[3],cat:c.id,p:k++%PAL.length}))});return{cats,apps}}

function tick(){
  const d=new Date();
  const date=d.toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const time=d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  $('sDate').textContent=date;$('sTime').textContent=time;
  $('hTime').textContent=time;$('hDate').textContent=date;
}
setInterval(tick,1000);tick();

  const on=state.favs.includes(a.url);
  return `<div class="card" role="button" tabindex="0" data-u="${esc(a.url)}" style="--c1:${a.c[0]};--c2:${a.c[1]};--g:${a.c[1]}99;--i:${i}">
   <button class="fav ${on?'on':''}" data-f="${esc(a.url)}" aria-label="ปักหมุด">${on?'★':'☆'}</button>
   <div class="ic">${esc(a.ic)}</div><div class="tx"><div class="nm">${esc(a.name)}</div><div class="ds">${esc(a.ds)}</div><span class="go">เปิดแอป ↗</span></div></div>`;
}
function render(){
  const q=state.q.trim().toLowerCase();
  const m=a=>(!q||(a.name+a.ds).toLowerCase().includes(q))&&(state.cat==='all'||state.cat==='fav'||a.cat===state.cat);
  let h='',n=0,i=0;
  const rec=(state.cat==='all'&&!q)?state.recent.map(u=>APPS.find(a=>a.url===u)).filter(Boolean):[];
  if(rec.length)h+=`<div class="sec">🕘 ใช้ล่าสุด <em>${rec.length}</em></div><div class="grid">${rec.map(a=>card(a,i++)).join('')}</div>`;
  const favs=APPS.filter(a=>state.favs.includes(a.url)&&m(a));
  if(favs.length&&state.cat!=='fav'||state.cat==='fav'){
    if(favs.length){h+=`<div class="sec">⭐ แอปโปรด <em>${favs.length}</em></div><div class="grid">${favs.map(a=>card(a,i++)).join('')}</div>`;n+=favs.length}
  }
  if(state.cat!=='fav')CATS.forEach(c=>{
    const L=APPS.filter(a=>a.cat===c.id&&m(a));if(!L.length)return;n+=L.length;
    h+=`<div class="sec"><span class="cb" style="background:linear-gradient(135deg,${c.c[0]},${c.c[1]})">${esc(c.ic)}</span>${esc(c.n)} <em>${L.length}</em></div><div class="grid">${L.map(a=>card(a,i++)).join('')}</div>`;
  });
  $('list').innerHTML=n?h:`<div class="empty"><div style="font-size:44px">🔍</div>ไม่พบแอปที่ตรงกับเงื่อนไข<br>ลองเปลี่ยนคำค้นหาหรือเลือกหมวดอื่น</div>`;
}
function chips(){
  const L=[['all','ทั้งหมด ('+APPS.length+')'],['fav','⭐ โปรด']].concat(CATS.map(c=>[c.id,esc(c.n)]));
  $('chips').innerHTML=L.map(x=>`<button class="chip ${state.cat===x[0]?'on':''}" data-c="${x[0]}">${x[1]}</button>`).join('');
}
$('chips').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;state.cat=b.dataset.c;chips();render()};
$('q').oninput=e=>{state.q=e.target.value;render()};
$('list').onclick=e=>{
  const f=e.target.closest('[data-f]');
  if(f){e.stopPropagation();const u=f.dataset.f,k=state.favs.indexOf(u);
    if(k>=0){state.favs.splice(k,1);toast('ยกเลิกการปักหมุดแล้ว')}else{state.favs.push(u);toast('เพิ่มในแอปโปรดแล้ว ⭐')}
    saveFav();render();return}
  const c=e.target.closest('[data-u]');if(c)openApp(c.dataset.u);
};
$('list').onkeydown=e=>{if(e.key==='Enter'&&e.target.dataset.u)openApp(e.target.dataset.u)};

/* ===== เปิดแอปในหน้าต่างเดียวกัน ===== */
let cur='';const POOL=new Map(),MAX=4;
/* iframe pool: แอปที่เคยเปิดจะค้างไว้ (สูงสุด 4) เปิดซ้ำได้ทันทีและข้อมูลที่กรอกไม่หาย */
function getFrame(u){
  let f=POOL.get(u);
  if(f){POOL.delete(u);POOL.set(u,f);return f}
  f=document.createElement('iframe');f.title='แอป';f.allow='geolocation; camera; fullscreen';
  f.addEventListener('load',()=>{f.dataset.ready='1';if(cur===u)$('vspin').classList.remove('show')});
  $('frames').appendChild(f);f.src=u;POOL.set(u,f);
  if(POOL.size>MAX){const k=[...POOL.keys()].find(x=>x!==cur&&x!==u);if(k){POOL.get(k).remove();POOL.delete(k)}}
  return f}
/* โหลดล่วงหน้าเมื่อชี้/แตะการ์ด เพื่อให้กดแล้วเปิดเร็วขึ้น */
function prefetch(u){if(!POOL.has(u)&&!$('viewer').classList.contains('show'))getFrame(u)}
function openApp(u,push){
  const a=APPS.find(x=>x.url===u);cur=u;
  $('vName').textContent=a?a.ic+' '+a.name:'แอป';
  const f=getFrame(u);
  [...$('frames').querySelectorAll('iframe')].forEach(n=>n.classList.toggle('on',n===f));
  $('vspin').classList.toggle('show',!f.dataset.ready);
  $('viewer').classList.add('show');document.body.classList.add('busy');
  addRecent(u);
  if(push!==false)history.pushState({v:1},'');
}
function closeApp(fromPop){
  if(!$('viewer').classList.contains('show'))return;
  $('viewer').classList.remove('show');document.body.classList.remove('busy');
  render();
  if(!fromPop&&history.state&&history.state.v)history.back(); // ให้ปุ่มย้อนกลับของเครื่องปิดแอปแทนการออกจากหน้า
}
$('vBack').onclick=()=>closeApp();
$('vOpen').onclick=()=>window.open(cur,'_blank','noopener');
$('vReload').onclick=()=>{const f=POOL.get(cur);if(f){delete f.dataset.ready;$('vspin').classList.add('show');f.src=cur}};
addEventListener('popstate',()=>closeApp(true));
addEventListener('keydown',e=>{
  if(e.key==='Escape')closeApp();
  else if(e.key==='/'&&!/INPUT|TEXTAREA/.test(e.target.tagName)&&!$('viewer').classList.contains('show')){e.preventDefault();$('q').focus()}});
let hv;
$('list').addEventListener('pointerover',e=>{const c=e.target.closest('.card');if(!c||e.target.closest('[data-f]'))return;
  clearTimeout(hv);const u=c.dataset.u;hv=setTimeout(()=>prefetch(u),e.pointerType==='mouse'?160:0)});
$('list').addEventListener('pointerdown',e=>{const c=e.target.closest('.card');if(c&&!e.target.closest('[data-f]'))prefetch(c.dataset.u)});

/* ===== หน้าโลโก้: เข้าอัตโนมัติ 3 วินาที / พักหน้าจอเมื่อไม่ใช้งาน 4 นาที ===== */
const SPLASH_MS=3000, IDLE_MS=4*60*1000;
let splashT=0,idleT=0,saver=false;
function startSplash(auto){
  saver=!auto;clearTimeout(splashT);
  const p=$('sProg');p.classList.remove('run');void p.offsetWidth;
  $('splash').classList.remove('hide');
  if(auto){p.style.setProperty('--d',SPLASH_MS/1000+'s');p.classList.add('run');
    $('sHint').textContent='กำลังเข้าสู่ระบบ… (แตะเพื่อข้าม)';$('sSub').textContent='ศูนย์รวมระบบปฏิบัติการ SBK Hub';
    splashT=setTimeout(enter,SPLASH_MS);
  }else{
    $('sHint').textContent='แตะหรือขยับเมาส์เพื่อกลับเข้าใช้งาน';$('sSub').textContent='โหมดพักหน้าจอ · Seacon Bangkae';
  }
}
function enter(){if(!enter.w){enter.w=1;setTimeout(()=>state.recent.slice(0,2).forEach(prefetch),1200)}clearTimeout(splashT);$('splash').classList.add('hide');saver=false;resetIdle()}
$('splash').onclick=enter;
function resetIdle(){
  clearTimeout(idleT);
  if(saver)return;
  idleT=setTimeout(()=>{
    // ถ้ากำลังเปิดแอปใน iframe จะตรวจการสัมผัสภายในไม่ได้ จึงไม่พักหน้าจอเพื่อไม่ให้งานค้าง
    if($('viewer').classList.contains('show')){resetIdle();return}
    startSplash(false);
  },IDLE_MS);
}
['mousemove','mousedown','keydown','touchstart','scroll','wheel','click'].forEach(ev=>addEventListener(ev,()=>{
  if(saver&&ev!=='mousemove'&&ev!=='scroll'&&ev!=='wheel')return; // ปลุกด้วยการแตะ/กดเท่านั้น (ผ่าน onclick)
  if(saver&&(ev==='mousemove'))enter();
  resetIdle();
},{passive:true}));

/* ===== เอฟเฟกต์อนุภาคลอยพื้นหลัง ===== */
(function(){
  const cv=$('fx'),x=cv.getContext('2d');let W,H,P=[];
  let cols,LC;function pal(){const L=document.documentElement.dataset.theme==='light';cols=L?['#2f8fe0','#f98050','#ffa94d','#ff5fa2','#10b981','#8b5cf6']:['#5db4e8','#f98050','#ffa94d','#ff5fa2','#2ee6a6','#ffffff'];LC=L?'#6f7fd6':'#8fb4ff'}
  function size(){pal();W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:Math.min(70,Math.floor(W*H/18000))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*3+1,vx:(Math.random()-.5)*.4,vy:-Math.random()*.6-.1,c:cols[Math.random()*cols.length|0],a:Math.random()*.5+.2}))}
  function loop(){
    if(document.hidden||document.body.classList.contains('busy')){requestAnimationFrame(loop);return}
    x.clearRect(0,0,W,H);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.y<-10){p.y=H+10;p.x=Math.random()*W}
      x.globalAlpha=p.a;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()});
    x.globalAlpha=.12;x.strokeStyle=LC;
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const dx=P[i].x-P[j].x,dy=P[i].y-P[j].y;
      if(dx*dx+dy*dy<9000){x.beginPath();x.moveTo(P[i].x,P[i].y);x.lineTo(P[j].x,P[j].y);x.stroke()}}
    requestAnimationFrame(loop)}
  addEventListener('resize',size);window.fxReset=size;size();loop();
})();

/* ===== โหมดสว่าง/มืด (จำค่าที่เลือกไว้) ===== */
function setTheme(m,save){document.documentElement.dataset.theme=m;$('theme').textContent=m==='light'?'🌙':'☀️';$('tc').content=m==='light'?'#f1f6ff':'#0b1033';
  if(save){try{localStorage.setItem('sbkTheme',m)}catch(e){}toast(m==='light'?'เปลี่ยนเป็นโหมดสว่าง ☀️':'เปลี่ยนเป็นโหมดมืด 🌙')}
  window.fxReset&&fxReset()}
$('theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='light'?'dark':'light',true);
/* ===== เอฟเฟกต์เอียงการ์ดตามเมาส์ (เฉพาะเดสก์ท็อป) ===== */
$('list').addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;const c=e.target.closest('.card');if(!c)return;
  const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
  c.style.setProperty('--ry',((px-.5)*12)+'deg');c.style.setProperty('--rx',(-(py-.5)*12)+'deg');
  c.style.setProperty('--mx',px*100+'%');c.style.setProperty('--my',py*100+'%')});
$('list').addEventListener('pointerout',e=>{const c=e.target.closest('.card');
  if(c&&!c.contains(e.relatedTarget)){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}});
/* ===== เมนูแอดมิน: เพิ่ม/แก้ไข/ลบ/เรียงลำดับแอปและหมวด (เก็บเฉพาะในเครื่อง/เบราว์เซอร์นี้) ===== */
let AV={v:'list'},PINOK=false,askCb=null;
const AD=$('admin'),AB=$('admBody');
const getPin=()=>{try{return localStorage.getItem('sbkPin')||''}catch(e){return ''}};
const ib=(a,i,x)=>`<button class="ib" data-a="${a}" data-i="${i}" aria-label="${a}">${x}</button>`;
const fld=(l,id,v,ph)=>`<label class="fl" for="${id}">${l}</label><input class="inp" id="${id}" value="${esc(v)}" placeholder="${esc(ph||'')}" autocomplete="off">`;
function openAdmin(){AD.classList.add('show');AV=getPin()&&!PINOK?{v:'pin'}:{v:'list'};adm()}
function closeAdmin(){AD.classList.remove('show');PINOK=false}
function commit(msg){saveCfg();if(state.cat!=='all'&&state.cat!=='fav'&&!CATS.some(c=>c.id===state.cat))state.cat='all';chips();render();AV={v:'list'};if(msg)toast(msg);adm()}
function ask(msg,cb){askCb=cb;AV={v:'ask',msg};adm()}
function adm(){
  const v=AV.v;let h='';
  if(v==='pin')h=`<p class="note">กรุณาใส่รหัส PIN เพื่อเข้าจัดการแอป</p><input class="inp" id="fPin" type="password" inputmode="numeric" placeholder="รหัส PIN"><div class="acts"><button class="abp" data-a="pinok">เข้าสู่ระบบ</button></div>`;
  else if(v==='list')h=`<p class="note">การตั้งค่าจะเก็บเฉพาะในเครื่อง/เบราว์เซอร์นี้ หากต้องการใช้ร่วมกันหลายเครื่อง ให้ใช้ "สำรอง/นำเข้า"</p>
    <div class="tb"><button class="abp" data-a="add">+ เพิ่มแอป</button><button class="ab" data-a="cadd">+ เพิ่มหมวด</button><button class="ab" data-a="io">💾 สำรอง/นำเข้า</button><button class="ab" data-a="pinset">🔒 รหัส PIN</button><button class="ab" data-a="reset">↺ รีเซ็ต</button></div>`+
    (CFG.cats.length?CFG.cats.map((c,ci)=>{const L=CFG.apps.map((a,i)=>[a,i]).filter(x=>x[0].cat===c.id);
      return `<div class="ag"><div class="ah"><span class="cb" style="background:linear-gradient(135deg,${c.c[0]},${c.c[1]})">${esc(c.ic)}</span><b>${esc(c.n)}</b><em>${L.length} แอป</em><span class="sp1"></span>${ib('cup',ci,'↑')}${ib('cdn',ci,'↓')}${ib('cedit',ci,'✎')}${ib('cdel',ci,'🗑')}</div>`+
      (L.length?L.map(([a,i])=>`<div class="ar"><span class="ai">${esc(a.ic)}</span><span class="an">${esc(a.name)}</span>${ib('up',i,'↑')}${ib('dn',i,'↓')}${ib('edit',i,'✎')}${ib('del',i,'🗑')}</div>`).join(''):'<div class="ar mu">ยังไม่มีแอปในหมวดนี้</div>')+'</div>'}).join(''):'<div class="empty">ยังไม่มีหมวด กด "+ เพิ่มหมวด" เพื่อเริ่มต้น</div>');
  else if(v==='app'){const a=AV.i>=0?CFG.apps[AV.i]:{name:'',url:'https://',ic:'📱',ds:'',cat:(CATS.some(c=>c.id===state.cat)?state.cat:(CFG.cats[0]||{}).id)};
    h=`<h3 style="margin:0">${AV.i>=0?'แก้ไขแอป':'เพิ่มแอปใหม่'}</h3>`+fld('ชื่อแอป','fN',a.name,'เช่น CCTV Database')+fld('ลิงก์ (URL)','fU',a.url,'https://...')+fld('ไอคอน (อีโมจิ)','fI',a.ic,'📱')+fld('คำอธิบายสั้น','fD',a.ds,'ไม่บังคับ')+
    `<label class="fl" for="fC">หมวดหมู่</label><select class="inp" id="fC">${CFG.cats.map(c=>`<option value="${esc(c.id)}" ${c.id===a.cat?'selected':''}>${esc(c.ic)} ${esc(c.n)}</option>`).join('')}</select>
    <label class="fl">สีการ์ด</label><div class="sws">${PAL.map((p,k)=>`<button class="sw ${k===AV.p?'on':''}" data-a="pick" data-i="${k}" style="background:linear-gradient(135deg,${p[0]},${p[1]})" aria-label="สี ${k+1}"></button>`).join('')}</div>
    <div class="acts"><button class="abp" data-a="save">บันทึก</button><button class="ab" data-a="back">ยกเลิก</button></div>`}
  else if(v==='cat'){const c=AV.i>=0?CFG.cats[AV.i]:{n:'',ic:'📁'};
    h=`<h3 style="margin:0">${AV.i>=0?'แก้ไขหมวด':'เพิ่มหมวดใหม่'}</h3>`+fld('ชื่อหมวด','fN',c.n,'เช่น ระบบรปภ.')+fld('ไอคอน (อีโมจิ)','fI',c.ic,'📁')+`<div class="acts"><button class="abp" data-a="csave">บันทึก</button><button class="ab" data-a="back">ยกเลิก</button></div>`}
  else if(v==='io')h=`<p class="note">คัดลอกข้อความนี้เก็บไว้เป็นไฟล์สำรอง หรือวางข้อความที่สำรองไว้แล้วกด "นำเข้า" (ข้อมูลปัจจุบันจะถูกแทนที่)</p><textarea class="inp" id="fJ" spellcheck="false">${esc(JSON.stringify({v:1,cats:CFG.cats,apps:CFG.apps}))}</textarea><div class="acts"><button class="abp" data-a="copy">คัดลอก</button><button class="ab" data-a="import">นำเข้า</button><button class="ab" data-a="back">กลับ</button></div>`;
  else if(v==='pinset')h=`<p class="note">ตั้งรหัส PIN 4–8 หลักเพื่อป้องกันการแก้ไขโดยไม่ตั้งใจ (เก็บในเบราว์เซอร์นี้ ไม่ใช่ระบบรักษาความปลอดภัยเต็มรูปแบบ)</p><input class="inp" id="fPin" type="password" inputmode="numeric" maxlength="8" placeholder="รหัส PIN ใหม่"><div class="acts"><button class="abp" data-a="pinsave">บันทึก</button>${getPin()?'<button class="abd" data-a="pindel">ลบรหัส PIN</button>':''}<button class="ab" data-a="back">กลับ</button></div>`;
  else if(v==='ask')h=`<p style="font-size:16px">${esc(AV.msg)}</p><div class="acts"><button class="abd" data-a="yes">ยืนยัน</button><button class="ab" data-a="no">ยกเลิก</button></div>`;
  AB.innerHTML=h;AB.scrollTop=0;
}
function saveApp(){
  const g=id=>$(id).value.trim(),o={name:g('fN'),url:g('fU'),ic:[...(g('fI')||'📱')].slice(0,8).join(''),ds:g('fD'),cat:$('fC')?$('fC').value:'',p:AV.p};
  if(!o.name){toast('กรุณากรอกชื่อแอป',1);return}
  if(!/^https?:\/\/\S+$/i.test(o.url)){toast('ลิงก์ต้องขึ้นต้นด้วย https:// และไม่มีช่องว่าง',1);return}
  if(!o.cat){toast('กรุณาเพิ่มหมวดก่อน',1);return}
  if(CFG.apps.some((x,k)=>x.url===o.url&&k!==AV.i)){toast('มีลิงก์นี้อยู่ในรายการแล้ว',1);return}
  if(AV.i<0)CFG.apps.push(o);else{const old=CFG.apps[AV.i].url;if(old!==o.url){state.favs=state.favs.map(u=>u===old?o.url:u);saveFav()}CFG.apps[AV.i]=o}
  commit(AV.i<0?'เพิ่มแอปสำเร็จ ✅':'บันทึกการแก้ไขแล้ว ✅')}
function saveCat(){
  const n=$('fN').value.trim(),ic=[...($('fI').value.trim()||'📁')].slice(0,8).join('');
  if(!n){toast('กรุณากรอกชื่อหมวด',1);return}
  if(AV.i<0)CFG.cats.push({id:'c'+Date.now().toString(36),n,ic,c:PAL[CFG.cats.length%PAL.length]});else Object.assign(CFG.cats[AV.i],{n,ic});
  commit('บันทึกหมวดแล้ว ✅')}
function doImport(){
  let o;try{o=JSON.parse($('fJ').value)}catch(e){toast('รูปแบบข้อมูลไม่ถูกต้อง กรุณาวางข้อความสำรองให้ครบ',1);return}
  if(!o||!Array.isArray(o.cats)||!Array.isArray(o.apps)){toast('ไม่พบข้อมูลหมวดและแอปในข้อความที่วาง',1);return}
  const S=(v,m)=>String(v==null?'':v).slice(0,m),hex=v=>/^#[0-9a-f]{3,8}$/i.test(v||''),mp={};
  const cats=o.cats.filter(c=>c&&c.n).map((c,k)=>{const id='c'+k+Date.now().toString(36);mp[c.id]=id;
    return{id,n:S(c.n,60),ic:S(c.ic||'📁',16),c:Array.isArray(c.c)&&hex(c.c[0])&&hex(c.c[1])?[c.c[0],c.c[1]]:PAL[k%PAL.length]}});
  const apps=o.apps.filter(a=>a&&a.name&&mp[a.cat]&&/^https?:\/\/\S+$/i.test(a.url||'')).map(a=>({name:S(a.name,80),url:S(a.url,500),ic:S(a.ic||'📱',16),ds:S(a.ds,80),cat:mp[a.cat],p:Number.isInteger(a.p)?a.p:undefined}));
  if(!cats.length){toast('ข้อมูลนำเข้าไม่มีหมวดที่ใช้งานได้',1);return}
  CFG={cats,apps};commit('นำเข้าข้อมูลสำเร็จ ✅')}
AB.onclick=e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
  switch(a){
    case 'pinok':if($('fPin').value===getPin()){PINOK=true;AV={v:'list'}}else{toast('รหัส PIN ไม่ถูกต้อง',1);return}break;
    case 'up':case 'dn':{const cat=CFG.apps[i].cat,d=a==='up'?-1:1;let j=i+d;while(j>=0&&j<CFG.apps.length&&CFG.apps[j].cat!==cat)j+=d;
      if(j>=0&&j<CFG.apps.length){[CFG.apps[i],CFG.apps[j]]=[CFG.apps[j],CFG.apps[i]];commit()}return}
    case 'cup':case 'cdn':{const j=i+(a==='cup'?-1:1);if(j>=0&&j<CFG.cats.length){[CFG.cats[i],CFG.cats[j]]=[CFG.cats[j],CFG.cats[i]];commit()}return}
    case 'add':AV={v:'app',i:-1,p:CFG.apps.length%PAL.length};break;
    case 'edit':AV={v:'app',i,p:Number.isInteger(CFG.apps[i].p)?CFG.apps[i].p:i%PAL.length};break;
    case 'pick':AV.p=i;AB.querySelectorAll('.sw').forEach((s,k)=>s.classList.toggle('on',k===i));return;
    case 'del':{const x=CFG.apps[i];ask(`ต้องการลบแอป “${x.name}” ใช่หรือไม่?`,()=>{CFG.apps.splice(i,1);commit('ลบแอปแล้ว')});return}
    case 'cadd':AV={v:'cat',i:-1};break;
    case 'cedit':AV={v:'cat',i};break;
    case 'cdel':{const c=CFG.cats[i];if(CFG.apps.some(x=>x.cat===c.id)){toast('กรุณาย้ายหรือลบแอปในหมวดนี้ก่อน',1);return}
      ask(`ต้องการลบหมวด “${c.n}” ใช่หรือไม่?`,()=>{CFG.cats.splice(i,1);commit('ลบหมวดแล้ว')});return}
    case 'save':saveApp();return;
    case 'csave':saveCat();return;
    case 'back':case 'no':AV={v:'list'};break;
    case 'io':AV={v:'io'};break;
    case 'pinset':AV={v:'pinset'};break;
    case 'pinsave':{const v=$('fPin').value.trim();if(!/^\d{4,8}$/.test(v)){toast('PIN ต้องเป็นตัวเลข 4–8 หลัก',1);return}
      try{localStorage.setItem('sbkPin',v)}catch(x){}toast('ตั้งรหัส PIN แล้ว ✅');AV={v:'list'};break}
    case 'pindel':try{localStorage.removeItem('sbkPin')}catch(x){}toast('ลบรหัส PIN แล้ว');AV={v:'list'};break;
    case 'reset':ask('ต้องการรีเซ็ตรายการแอปทั้งหมดกลับเป็นค่าเริ่มต้นใช่หรือไม่? การแก้ไขที่ทำไว้จะหายไป',()=>{CFG=defaultCfg();commit('รีเซ็ตเป็นค่าเริ่มต้นแล้ว')});return;
    case 'yes':{const f=askCb;askCb=null;AV={v:'list'};if(f)f();else adm();return}
    case 'copy':{const ta=$('fJ');ta.select();const ok=()=>toast('คัดลอกแล้ว ✅'),fb=()=>{try{document.execCommand('copy');ok()}catch(x){toast('คัดลอกไม่สำเร็จ กรุณากดค้างที่ข้อความแล้วเลือกคัดลอก',1)}};
      try{navigator.clipboard.writeText(ta.value).then(ok,fb)}catch(x){fb()}return}
    case 'import':doImport();return;
    case 'close':closeAdmin();return;
  }
  adm();
};
$('gear').onclick=openAdmin;$('admX').onclick=closeAdmin;
addEventListener('keydown',e=>{if(e.key==='Escape'&&AD.classList.contains('show'))closeAdmin()});
setTheme(document.documentElement.dataset.theme);
chips();render();setTimeout(()=>$('list').classList.add('static'),1500);startSplash(true);
</script>
